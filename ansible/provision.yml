---
# Baseline provisioning for every homelab host: Docker (app runtime),
# node_exporter (host metrics), and the status heartbeat (dead-man's
# switch). Idempotent — safe to re-run any time.
#
#   ansible-playbook provision.yml -K
- name: Provision homelab hosts
  hosts: homelab
  become: true
  roles:
    - docker
    - node_exporter
    - heartbeat
