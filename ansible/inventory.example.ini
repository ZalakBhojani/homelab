# Copy to inventory.ini and fill in your hosts — inventory.ini is gitignored.
[homelab]
192.168.1.10
192.168.1.11
192.168.1.12

[homelab:vars]
ansible_user=youruser
# Ubuntu 25.10+ defaults to sudo-rs, which rewrites Ansible's custom prompt
# (-p) and breaks become-prompt detection. Use classic sudo instead.
ansible_become_exe=/usr/bin/sudo.ws
